
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RemedyTrack - New Finding</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .container {
            border: 1px solid white;
            border-radius: 20px;
            padding: 30px;
            max-width: 900px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        a {
            color: white;
        }

        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;
            margin-bottom: 8px;
        }

        form input, form textarea, form select {
            background: #111;
            color: white;
            border: 1px solid #888;
            border-radius: 5px;
            padding: 10px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        button {
            background: #222;
            color: white;
            border: 1px solid #888;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <h1>RemedyTrack</h1>
            <nav>
                <a href="{% url 'dashboard' %}">Dashboard</a> |
                <a href="{% url 'finding_list' %}">Findings</a>
            </nav>
        </div>

        
<h2>
    {% if editing %}
        Edit Finding
    {% else %}
        New Finding
    {% endif %}
</h2>


        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Save Finding</button>
            <a href="{% url 'finding_list' %}">Cancel</a>
        </form>

    </div>
</body>
</html>
